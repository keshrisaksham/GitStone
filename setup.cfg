[metadata]
name = gitstone
version = attr: gitstone.__version__
author = Maxime Arthaud
author_email = maxime@arthaud.me
license = MIT
description = GitStone, a tool to dump a git repository from a website
long_description = file: README.md
long_description_content_type = text/markdown
# TODO: update to the real repo URL once this is published
url = https://github.com/YOUR-ORG/gitstone
keywords = dump, git, repository, security, vulnerability, ctf
classifiers =
    Development Status :: 5 - Production/Stable
    License :: OSI Approved :: MIT License
    Topic :: Security

[options]
package_dir =
    =GitStone-Packages
py_modules = gitstone
packages = find:
python_requires = >=3.9
install_requires =
    PySocks>=1.7
    requests>=2.25
    beautifulsoup4>=4.9
    dulwich>=0.22
    requests-pkcs12>=1.14

[options.packages.find]
where = GitStone-Packages

[options.package_data]
gitstone_webui = templates/*.html, static/*.css

[options.extras_require]
webui =
    Flask>=2.3

[options.entry_points]
console_scripts =
    gitstone = gitstone:main
    gitstone-ui = gitstone_webui.app:main [webui]
