{% extends "base.html" %}
{% block title %}Log in - GitStone{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Access token</h1>
  <p class="hint">This GitStone server is reachable from the network. Enter the
    access token printed when it started.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('ui.login') }}" class="form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label><span>Token</span>
      <input type="password" name="token" autocomplete="off" required autofocus>
    </label>
    <button type="submit" class="primary">Log in</button>
  </form>
</div>
{% endblock %}
