{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>{{ 'Not found' if code == 404 else 'Error ' ~ code }}</h1>
  <p>{{ message }}</p>
  {% if detail %}<pre class="snippet error-detail">{{ detail }}</pre>{% endif %}
  <p><a href="{{ url_for('ui.dashboard') }}">&larr; back to dumps</a></p>
</div>
{% endblock %}
